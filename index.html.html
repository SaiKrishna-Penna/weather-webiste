<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weather</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <style href="style.css">
    
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="sw">
        <input id="cityInput" placeholder="Search any city, town or area" autocomplete="off">
        <div class="sug" id="sug"></div>
      </div>
      <button class="ic" id="gpsBtn" title="Use my location">📍</button>
      <button class="ic" id="mapBtn" title="Pick any spot on the map">🗺️</button>
    </div>

    <div class="chips" id="chips"></div>
    <div class="hero" id="hero"></div>

    <div class="card" id="areas" hidden><h4>⭐ My areas</h4><div id="areaList"></div></div>
    <div class="card"><h4>🕒 Hourly forecast</h4><div class="hourly" id="hourly"></div></div>
    <div class="card"><h4>📅 7-day forecast</h4><div id="daily"></div></div>
    <div class="grid" id="details"></div>

    <div id="status">Loading...</div>
  </div>

  <!-- Map picker -->
  <div id="mapWrap">
    <div id="map"></div>
    <div class="mapBar">
      <button id="mapClose">Cancel</button>
      <button id="pickBtn" disabled>Get weather here</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script href="script.js">
    
  </script>
</body>
</html>
